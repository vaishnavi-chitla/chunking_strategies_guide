<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Page</title>

<style>
  .highlighted { 
      color: red; 
      font-size: 20px; 
      background-color: yellow; 
  }
</style>

</head>
<body>

<div id="main-section">
    <h1>Welcome</h1>
</div>

<div id="secondary-section">
    <p>This section exists for testing.</p>
</div>

<img src="photo.jpg" alt="Sample image">

<p class="highlighted">
    This paragraph uses a CSS class.
</p>

<a href="/target-page">Click here</a>

<script>

// GLOBAL variable misuse
var total = 0;

// Inefficient loop (performance issue)
function sumNumbers(arr){
    for(var i = 0; i < arr.length; i++){
        for(var j = 0; j < arr.length; j++){   // unnecessary nested loop
            total += arr[i];
        }
    }
    return total;
}

// Logic mistake: incorrect average calculation
function calculateAverage(numbers){
    let sum = numbers.reduce((a,b)=>a+b,0);
    return sum / (numbers.length - 1);  // wrong divisor
}

// Weak input validation
function calculateRatio(a,b){
    if(!b){
        console.log("Invalid divisor");
        return 0;   // silently returning wrong value instead of proper handling
    }
    return a/b;
}

// Unnecessary DOM queries
function changeTitle(){
    var el = document.getElementById("main-section");
    document.getElementById("main-section").innerText = "Hello User";
}

// Async mistake (missing await)
async function loadData(){
    let data = fetch("https://api.example.com/data");
    console.log(data); // logs promise instead of response
}

// Debug log left in production
console.log("Page loaded");

// Memory leak pattern (interval never cleared)
setInterval(function(){
    console.log("Running background task");
},1000);

// Event listener added repeatedly (bad practice)
document.body.addEventListener("click", function(){
    document.getElementById("secondary-section").style.color = "blue";
});

</script>

</body>
</html>
